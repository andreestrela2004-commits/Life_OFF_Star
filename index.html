<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2557d6">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>LifeOFFstar</title>
<style>
:root{--bg:#f2f3f5;--pn:#fff;--p2:#e8eaee;--ln:#d9dce2;--tx:#1b1f27;--mu:#657080;--ac:#2557d6;--ab:#e3eafb;--af:#fff;--ok:#23915f;--wr:#c2410c}
@media(prefers-color-scheme:dark){:root{--bg:#131519;--pn:#1b1e24;--p2:#262a32;--ln:#333843;--tx:#e8eaee;--mu:#98a1b0;--ac:#6e98f2;--ab:#1d2842;--af:#0c1220;--ok:#4cc08c;--wr:#f08a5d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--pn);border-right:1px solid var(--ln);padding:22px 14px;display:flex;flex-direction:column;gap:5px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-size:19px;font-weight:800;letter-spacing:-.5px}.brand b{color:var(--ac)}
.star{width:36px;height:36px;border-radius:11px;background:var(--ac);color:var(--af);display:grid;place-items:center;font-size:21px}
.nav{border:0;background:none;color:var(--mu);text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;font:inherit}.nav.on,.nav:hover{background:var(--ab);color:var(--ac)}
.col{min-width:0}.tb{display:flex;justify-content:flex-end;position:relative;max-width:1100px;margin:auto;padding:14px clamp(16px,4vw,48px) 0}.mbtn{width:42px;height:42px;border-radius:50%;border:2px solid var(--ln);padding:0;overflow:hidden;background:var(--pn);cursor:pointer}.mbtn img{width:100%;height:100%;display:block}.mbtn.on,.mbtn:hover{border-color:var(--ac)}
.pop{position:absolute;top:62px;right:clamp(16px,4vw,48px);min-width:210px;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:6px;box-shadow:0 8px 24px #0003;z-index:8}.pop[hidden]{display:none}.pop button,.pop a{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);font:inherit;padding:11px 12px;border-radius:8px;cursor:pointer;text-decoration:none}.pop button:hover,.pop a:hover{background:var(--ab);color:var(--ac)}
.main{padding:12px clamp(16px,4vw,48px) 28px;max-width:1100px;width:100%;margin:auto}
.head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:22px}h1{font-size:clamp(25px,4vw,32px);letter-spacing:-1px;margin:0 0 4px}.mu{color:var(--mu)}
.btn{border:1px solid var(--ln);background:var(--pn);color:var(--tx);border-radius:10px;padding:10px 14px;font:inherit;font-weight:650;cursor:pointer}.pri{background:var(--ac);border-color:var(--ac);color:var(--af)}.dg{color:var(--wr)}
.btn:focus-visible,.tk:focus-visible,.ch:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:18px;min-width:0}.card h2{font-size:16px;margin:0 0 4px}
.lb{color:var(--mu);font-size:13px}.num{font-size:28px;font-weight:800;margin:6px 0 2px}
.bar{height:6px;border-radius:9px;background:var(--p2);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--ac)}
.it{display:flex;gap:11px;align-items:center;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:11px 12px;margin-top:8px}
.tk{width:22px;height:22px;border:1.5px solid var(--mu);border-radius:7px;background:none;color:var(--tx);cursor:pointer;flex:none;font-weight:800;padding:0}.it.dn .tk{background:var(--ok);border-color:var(--ok);color:#fff}.it.off{opacity:.55}.it.dn .nm{text-decoration:line-through;color:var(--mu)}
.tx{flex:1;min-width:0}.nm{font-weight:650;font-size:14px}.ds{font-size:12px;color:var(--mu);margin-top:2px}
.tg{display:inline-block;background:var(--ab);color:var(--ac);border-radius:20px;padding:2px 9px;font-size:11px;margin:6px 6px 0 0}.tg.wr{background:none;color:var(--wr);border:1px solid var(--wr)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.ch{border:1px solid var(--ln);background:var(--pn);color:var(--mu);border-radius:20px;padding:7px 13px;cursor:pointer;font:inherit;font-size:13px}.ch.on{background:var(--ab);color:var(--ac);border-color:var(--ac)}
.empty{padding:22px;text-align:center;color:var(--mu);border:1px dashed var(--ln);border-radius:10px;margin-top:8px}
.qa{display:flex;gap:8px;margin-bottom:14px}.qa input{flex:1}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;font:inherit}
.mbg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}.mbg.on{display:flex}
.md{width:min(480px,100%);max-height:92vh;overflow:auto;background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:20px}.md h2{margin:0 0 6px}
.f{display:grid;gap:5px;margin:12px 0}.f label{font-size:12px;color:var(--mu);font-weight:650}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ac{display:flex;gap:9px;justify-content:flex-end;margin-top:16px}
.tk:disabled{cursor:default;opacity:.75}.sub{margin:8px 0 0;padding:4px 10px;font-size:12px}
.bars{display:flex;gap:8px;align-items:end;height:120px;margin-top:10px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.bars i{display:block;background:var(--ac);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:4px}
.fab{position:fixed;right:18px;bottom:24px;width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:var(--af);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 6px 18px #0004;z-index:6}
.ib{border:0;background:none;color:var(--mu);font-size:20px;width:36px;height:36px;border-radius:8px;cursor:pointer;flex:none}.ib:hover{background:var(--p2)}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 2px}.gh h2{font-size:15px;margin:0}.kid{margin-left:18px;border-left:2px solid var(--ln);padding-left:10px}
.tile{cursor:pointer;text-align:left;font:inherit;color:var(--tx)}.tile:hover{border-color:var(--ac)}.hero .num{font-size:40px}
details>summary{cursor:pointer;color:var(--mu);margin:0}details[open]>summary{margin-bottom:8px}.chips.tight{margin:6px 0 0}
.sm{padding:7px 14px;font-size:14px}.ob{border-color:var(--ac);color:var(--ac)}
.mob{display:none}
@media(max-width:850px){.app{display:block}.side{display:none}.fab{bottom:calc(76px + env(safe-area-inset-bottom))}.main{padding:8px 14px 90px}.tb{padding:10px 14px 0}.pop{right:14px}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.mob{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--pn);border-top:1px solid var(--ln);justify-content:space-around;padding:7px 2px calc(7px + env(safe-area-inset-bottom));z-index:5}.mob button{background:none;border:0;color:var(--mu);font:inherit;font-size:10px;display:grid;gap:2px;justify-items:center}.mob button span{font-size:19px}.mob button.on{color:var(--ac)}.head{flex-direction:column;align-items:flex-start}}
</style></head>
<body>
<div class="app"><aside class="side"><div class="brand"><div class="star">✦</div><div>Life<b>OFF</b>star</div></div><div id="sn"></div><div class="mu" style="margin-top:auto;font-size:12px;padding:10px">Take Control of Your Life.</div></aside><div class="col"><div class="tb"><button class="mbtn" id="mb" aria-label="Menu" aria-haspopup="true" aria-expanded="false" onclick="tm()"><img src="icon-192.png" alt=""></button><div class="pop" id="pop" hidden><button onclick="go('stats')">↗　Estatísticas</button><button onclick="go('set')">⚙　Definições</button><a href="ajuda.html">?　Como usar</a></div></div><main class="main" id="main"></main></div></div>
<nav class="mob" id="mob"></nav>

<div class="mbg" id="mg" onclick="if(event.target===this)cl()"><form class="md" id="fg"><h2 id="gh">Objetivo</h2><input type="hidden" id="ge"><input type="hidden" id="gpa">
<div class="f"><label>Nome *</label><input id="gn" required maxlength="80" placeholder="Ex.: Treinar 3 vezes"></div>
<div class="f"><label>Descrição</label><textarea id="gd" rows="2"></textarea></div>
<div class="row"><div class="f"><label>Periodicidade</label><select id="gp" onchange="$('gdw').style.display=this.value==='daily'?'':'none'"><option value="daily">Diário</option><option value="weekly">Semanal</option><option value="monthly">Mensal</option><option value="yearly">Anual</option></select></div><div class="f"><label>Categoria</label><select id="gc"></select></div></div>
<div class="f" id="gdw"><label>Dias da semana (só objetivos diários)</label><div class="chips" id="gdd" style="margin:0"></div></div>
<div class="row"><div class="f"><label>Vezes por período</label><input id="gk" type="number" min="1" value="1"></div><div class="f"><label>Meta de sub-objetivos</label><input id="gt" type="number" min="1" placeholder="Ex.: 12"></div></div>
<div class="ac"><button type="button" class="btn dg" id="gx" style="margin-right:auto" onclick="dg()">Apagar</button><button type="button" class="btn" onclick="cl()">Cancelar</button><button class="btn pri">Guardar</button></div></form></div>

<div class="mbg" id="mr" onclick="if(event.target===this)cl()"><form class="md" id="fr"><h2>Lembrete</h2><input type="hidden" id="re">
<div class="f"><label>O que tens de fazer? *</label><input id="rt" required maxlength="100" placeholder="Ex.: Ligar ao médico de família"></div>
<div class="row"><div class="f"><label>Etiqueta</label><input id="rg" list="tl" placeholder="Compras, Ligar…"><datalist id="tl"></datalist></div><div class="f"><label>Data (opcional)</label><input id="rd" type="date"></div></div>
<div class="row"><div class="f"><label>Hora (opcional)</label><input id="rh" type="time"></div><div class="f"><label>Repetir</label><select id="rp"><option value="none">Não repetir</option><option value="daily">Todos os dias</option><option value="weekly">Todas as semanas</option><option value="monthly">Todos os meses</option><option value="yearly">Todos os anos</option></select></div></div>
<div class="ac"><button type="button" class="btn dg" id="rx" style="margin-right:auto" onclick="dr()">Apagar</button><button type="button" class="btn" onclick="cl()">Cancelar</button><button class="btn pri">Guardar</button></div></form></div>

<div class="mbg" id="ma" onclick="if(event.target===this)cl()"><div class="md"><h2>Adiar para quando?</h2><div class="f"><button class="btn" onclick="pz(1)">Amanhã</button><button class="btn" onclick="pz(3)">Daqui a 3 dias</button><button class="btn" onclick="pz(7)">Daqui a uma semana</button><input type="date" aria-label="Escolher data" onchange="if(this.value)pz(0,this.value)"></div><div class="ac"><button class="btn" onclick="cl()">Cancelar</button></div></div></div>
<div class="mbg" id="mc" onclick="if(event.target===this)cl()"><div class="md"><h2>Adicionar ao calendário</h2><p class="mu" style="font-size:13px;margin:0">O evento é criado com o texto, a data, a hora e a repetição. O aviso segue as definições do teu calendário.</p><div class="f"><button class="btn pri" onclick="gcal()">Google Calendar</button><button class="btn" onclick="ics()">Ficheiro de calendário (.ics)</button></div><div class="ac"><button class="btn" onclick="cl()">Cancelar</button></div></div></div>
<button class="fab" id="fab" onclick="$('mq').classList.add('on')" aria-label="Adicionar">＋</button>
<div class="mbg" id="mq" onclick="if(event.target===this)cl()"><div class="md"><h2>Adicionar</h2><div class="f"><button class="btn" onclick="cl();eg(null,'daily')">Novo objetivo</button><button class="btn" onclick="cl();er()">Novo lembrete</button><button class="btn" onclick="cl();show('shop');setTimeout(()=>$('sq')&&$('sq').focus(),50)">Novo produto</button></div><div class="ac"><button class="btn" onclick="cl()">Cancelar</button></div></div></div>
<div class="mbg" id="mx" style="z-index:12"><form class="md" id="fx"><h2 id="xt"></h2><p class="mu" id="xm" style="margin:4px 0 0"></p><div class="f" id="xf"><input id="xi" maxlength="80"></div><div class="ac"><button type="button" class="btn dg" id="xd" style="margin-right:auto"></button><button type="button" class="btn" id="xc">Cancelar</button><button class="btn pri" id="xo">OK</button></div></form></div>
<script>
const $=id=>document.getElementById(id),L=localStorage;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PN={daily:'Diário',weekly:'Semanal',monthly:'Mensal',yearly:'Anual'},U={daily:'dias',weekly:'semanas',monthly:'meses',yearly:'anos'};
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>ymd(new Date());
const mon=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const key=(p,d=new Date())=>p==='daily'?ymd(d):p==='weekly'?ymd(mon(d)):p==='monthly'?ymd(d).slice(0,7):''+d.getFullYear();
const back=(p,d)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());if(p==='daily')x.setDate(x.getDate()-1);else if(p==='weekly')x.setDate(x.getDate()-7);else{x.setDate(1);if(p==='monthly')x.setMonth(x.getMonth()-1);else x.setFullYear(x.getFullYear()-1)}return x};
const get=(k,d)=>{try{return JSON.parse(L.getItem(k))??d}catch{return d}};
const seedG=[['Fazer exercício','Reservar tempo para cuidar da saúde.','daily','Saúde e exercício'],['Ler durante 20 minutos','','daily','Desenvolvimento pessoal'],['Treinar 3 vezes','','weekly','Saúde e exercício'],['Rever o orçamento','','monthly','Finanças'],['Ler 12 livros','','yearly','Desenvolvimento pessoal']].map((a,i)=>({id:'d'+i,name:a[0],desc:a[1],period:a[2],cat:a[3],hist:[]}));
const seedR=[['Comprar leite','Compras','','none'],['Ligar ao médico de família','Ligar',today(),'none'],['Pagar a renda','Casa',today(),'monthly']].map((a,i)=>({id:'s'+i,text:a[0],tag:a[1],date:a[2],rep:a[3],done:false}));
let cats=get('losCats',['Saúde e exercício','Trabalho e carreira','Finanças','Desenvolvimento pessoal','Casa e vida pessoal','Outros']),goals=get('losGoals',null)||seedG,rems=get('losRem',null)||seedR,tags=get('losTags',['Compras','Ligar','Casa','Outros']);
const fix=()=>goals.forEach(g=>{if(!g.hist)g.hist=g.done?[key(g.period)]:[];delete g.done});fix();
let buy=get('losShop',[]);
if(!L.getItem('losMig9')){rems.filter(r=>r.tag==='Compras'&&!r.done).forEach(r=>buy.push({id:'p'+r.id,name:r.text,need:true}));rems=rems.filter(r=>r.tag!=='Compras');tags=tags.filter(t=>t!=='Compras');if(!rems.some(r=>/compras/i.test(r.text)))rems.unshift({id:'r'+Date.now(),text:'Ir às compras',tag:'Casa',date:'',time:'',rep:'none',done:false});L.setItem('losMig9','1')}
const PL={daily:'Diários',weekly:'Semanais',monthly:'Mensais',yearly:'Anuais'};
let view='home',gF='all',rF='all';
const save=()=>{L.setItem('losGoals',JSON.stringify(goals));L.setItem('losCats',JSON.stringify(cats));L.setItem('losRem',JSON.stringify(rems));L.setItem('losTags',JSON.stringify(tags));L.setItem('losShop',JSON.stringify(buy))};
const SUB={yearly:'monthly',monthly:'weekly',weekly:'daily'};
const kids=g=>goals.filter(c=>c.parent===g.id);
const within=(p,k)=>{if(p==='weekly'){const m=mon(new Date());return [...Array(7)].some((_,i)=>{const d=new Date(m);d.setDate(d.getDate()+i);return ymd(d)===k})}return k.startsWith(key(p))};
const prog=g=>kids(g).reduce((s,c)=>s+c.hist.filter(k=>within(g.period,k)).length,0);
const der=g=>g.target>0&&kids(g).length>0;
const PT={daily:'hoje',weekly:'esta semana',monthly:'este mês',yearly:'este ano'},DN=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const due=g=>g.period!=='daily'||!g.days?.length||g.days.includes(new Date().getDay());
const isDone=g=>der(g)?prog(g)>=g.target:g.hist.includes(key(g.period));
const streak=g=>{const sk=d=>{if(g.period==='daily'&&g.days?.length)for(let i=0;i<7&&!g.days.includes(d.getDay());i++)d=back('daily',d);return d};let d=sk(new Date()),n=0;if(due(g)&&!isDone(g))d=sk(back(g.period,d));while(g.hist.includes(key(g.period,d))){n++;d=sk(back(g.period,d))}return n};
const nxt=(s,r)=>{const d=s?new Date(s+'T00:00'):new Date(),t=new Date();t.setHours(0,0,0,0);const f=()=>{if(r==='daily')d.setDate(d.getDate()+1);else if(r==='weekly')d.setDate(d.getDate()+7);else if(r==='monthly')d.setMonth(d.getMonth()+1);else d.setFullYear(d.getFullYear()+1)};f();while(s&&d<=t)f();return ymd(d)};
const dl=s=>{const t=today(),m=ymd(new Date(Date.now()+864e5));return s===t?'Hoje':s===m?'Amanhã':new Date(s+'T00:00').toLocaleDateString('pt-PT',{day:'numeric',month:'short'})};
const sr=a=>[...a].sort((x,y)=>(x.done-y.done)||((x.date||'9')>(y.date||'9')?1:-1));
const ls=(a,f,m)=>a.length?a.map(f).join(''):`<div class="empty">${m}</div>`;
const hd=(t,s,b)=>`<div class="head"><div><h1>${t}</h1><div class="mu">${s}</div></div>${b||''}</div>`;
const chips=(a,cur,fn,lab)=>`<div class="chips">${a.map(k=>`<button class="ch ${k===cur?'on':''}" data-k="${esc(k)}" onclick="${fn}(this.dataset.k)">${esc(lab(k))}</button>`).join('')}</div>`;
const gi=g=>{const n=streak(g),d=der(g),pa=goals.find(x=>x.id===g.parent),c=(g.cnt||{})[key(g.period)]||0,ct=g.times>1,meta=[g.cat,PN[g.period],g.days?.length?g.days.map(i=>DN[i]).join(' '):'',pa?'↑ '+pa.name:'',n>1&&!d?n+' '+U[g.period]+' seguidos':'',ct?c+' de '+g.times+' '+PT[g.period]:''].filter(Boolean).map(esc).join(' · ');
return `<div class="it ${isDone(g)?'dn':''} ${due(g)?'':'off'}"><button class="tk" aria-label="Concluir" ${d?'disabled':''} onclick="tg('${g.id}')">${isDone(g)?'✓':ct?c:''}</button><div class="tx" style="cursor:pointer" onclick="eg('${g.id}')"><div class="nm">${esc(g.name)}</div><div class="ds">${meta}</div>${g.desc?`<div class="ds">${esc(g.desc)}</div>`:''}${d?`<div class="bar"><i style="width:${Math.min(100,Math.round(prog(g)/g.target*100))}%"></i></div><div class="ds">${prog(g)} de ${g.target} concluídos</div>`:''}${ct&&c>0?`<button class="ch sub" onclick="event.stopPropagation();dc('${g.id}')">−1</button> `:''}${SUB[g.period]?`<button class="ch sub" onclick="event.stopPropagation();eg(null,'${SUB[g.period]}','${g.id}')">＋ Sub-objetivo</button>`:''}</div><button class="ib" aria-label="Editar" onclick="eg('${g.id}')">⋯</button></div>`};
const ri=r=>`<div class="it ${r.done?'dn':''}"><button class="tk" aria-label="Concluir" onclick="tr('${r.id}')">${r.done?'✓':''}</button><div class="tx" style="cursor:pointer" onclick="er('${r.id}')"><div class="nm">${esc(r.text)}</div><div class="ds">${[r.tag,r.date?dl(r.date)+(r.time?' '+r.time:''):'',r.rep!=='none'?'↻ '+PN[r.rep]:''].filter(Boolean).map(esc).join(' · ')}</div>${!r.done&&r.date&&r.date<today()?'<span class="tg wr">Em atraso</span>':''}${r.done?'':`<button class="ch sub" onclick="event.stopPropagation();ad('${r.id}')">Adiar</button> ${r.date?`<button class="ch sub" onclick="event.stopPropagation();cal('${r.id}')">＋ Calendário</button>`:''}`}</div><button class="ib" aria-label="Editar" onclick="er('${r.id}')">⋯</button></div>`;
const tile=(t,p)=>{const a=goals.filter(g=>g.period===p&&due(g)),d=a.filter(isDone).length,x=a.length?Math.round(d/a.length*100):0;return `<button class="card tile" onclick="jg('${p}')"><div class="lb">${t}</div><div class="num">${d}/${a.length}</div><div class="bar"><i style="width:${x}%"></i></div></button>`};
const jg=p=>{gF=p;show('goals')};
const NAV=[['home','⌂','Início'],['goals','◎','Objetivos'],['shop','▤','Compras'],['rem','☑','Lembretes']];
const V={
home:d=>{const D=goals.filter(g=>g.period==='daily'&&due(g)),R=sr(rems.filter(r=>r.date&&r.date<=today()&&!r.done)),t=D.length,n=D.filter(isDone).length,pend=[...R.map(ri),...D.filter(g=>!isDone(g)).map(gi)],fin=D.filter(isDone).map(gi);
